# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gemini/**'
      - '**.md'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Environment Variables
        run: |
          cat <<EOF > WebsiteCms/src/environments/environment.ts
          export const environment = {
            production: true,
            useEmulators: false,
            firebase: {
              projectId: '${{ secrets.VUE_APP_FIREBASE_PROJECT_ID }}',
              appId: '${{ secrets.VUE_APP_FIREBASE_APP_ID }}',
              storageBucket: '${{ secrets.VUE_APP_FIREBASE_STORAGE_BUCKET }}',
              apiKey: '${{ secrets.VUE_APP_FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.VUE_APP_FIREBASE_AUTH_DOMAIN }}',
              messagingSenderId: '${{ secrets.VUE_APP_FIREBASE_MESSAGING_SENDER_ID }}',
            }
          };
          EOF
      - name: Install, build, and test
        run: cd WebsiteCms && npm ci && npm run build && npm run test -- --watch=false --browsers=ChromeHeadless
        env:
          VUE_APP_FIREBASE_API_KEY: ${{ secrets.VUE_APP_FIREBASE_API_KEY }}
          VUE_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.VUE_APP_FIREBASE_AUTH_DOMAIN }}
          VUE_APP_FIREBASE_PROJECT_ID: ${{ secrets.VUE_APP_FIREBASE_PROJECT_ID }}
          VUE_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.VUE_APP_FIREBASE_STORAGE_BUCKET }}
          VUE_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VUE_APP_FIREBASE_MESSAGING_SENDER_ID }}
          VUE_APP_FIREBASE_APP_ID: ${{ secrets.VUE_APP_FIREBASE_APP_ID }}
          VUE_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.VUE_APP_FIREBASE_MEASUREMENT_ID }}
